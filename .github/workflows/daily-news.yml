name: Update daily news
'on':
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: read
concurrency:
  group: daily-news-edition
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --only-binary=:all: Pillow==12.3.0'
      - run: python3 -B -m unittest discover -s tools -p 'test_news*.py'
      - run: node --test tools/daily-news-reader.test.cjs
      - run: python3 -B tools/update_news.py --output "$RUNNER_TEMP/edition.json"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-edition
          path: ${{ runner.temp }}/edition.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: daily-edition
          path: ${{ runner.temp }}/news
      - name: Publish edition and request a branch-source Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/news/edition.json"
          out=p/daily-news/edition.json
          api="repos/$GITHUB_REPOSITORY/pages/builds"
          jq -es 'length == 1 and (.[0] | .date as $day |
            (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.updated | startswith($day)) and
            (.stories | type == "array" and length == 10) and
            ([.stories[].region] | sort == ([range(4) | "国内"] + [range(6) | "国际"] | sort)))' "$candidate" >/dev/null
          if [[ -f "$out" ]] && jq -es '.[0].date == .[1].date and .[0].stories == .[1].stories' "$out" "$candidate" >/dev/null; then
            # A prior push may have succeeded while its build request failed.
            tip=$(git rev-parse HEAD)
            built=$(gh api "$api?per_page=1" --jq '.[0] | [.commit, .status] | join(":")')
            if [[ "$built" == "$tip:built" ]]; then
              echo 'Edition unchanged and main already built'; exit 0
            fi
          else
            if [[ $(git rev-parse HEAD) != "$GITHUB_SHA" ]]; then
              echo 'main advanced since collection; run again from current main' >&2; exit 1
            fi
            cp -- "$candidate" "$out"
            git add -- "$out"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update daily news edition' -- "$out"
            git push origin HEAD:refs/heads/main
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api"
